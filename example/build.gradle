apply from: './../config.gradle'
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
android {
    namespace 'com.ansolm.carouselbanner.example'
    compileSdk = 37

    defaultConfig {
        applicationId "com.ansolm.carouselbanner.example"
        minSdk = 21
        targetSdk = 37
        versionCode buidConfig.versionCode
        versionName buidConfig.versionName
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

dependencies {
    implementation dependent.kotlinJdk7
    implementation dependent.appcompat
    implementation dependent.constraintlayout
    implementation dependent.glide
    implementation project(":carouselbanner")
    implementation dependent.recyclerview
    implementation dependent.cardview
}