apply from: './../config.gradle'
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
android {
    publishing {
        singleVariant('release')
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'com.ansolm.carouselbanner'
    compileSdk = 37
    defaultConfig {
        minSdk = 21
        targetSdk = 37
        versionCode buidConfig.versionCode
        versionName buidConfig.versionName
    }
}

dependencies {
    implementation dependent.kotlinJdk7
    compileOnly dependent.appcompat
    compileOnly dependent.recyclerview
    implementation dependent.cardview
}

apply plugin: 'maven-publish'

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                groupId = 'com.github.ansolm'
                artifactId = 'carouselbanner'
                version = '1.0.1'
                from components.release
            }
        }
    }
}
